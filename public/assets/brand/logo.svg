<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" aria-label="Label By Vinnie Logo">
  <!-- Circular Emblem with Gold Rim -->
  <g transform="translate(4, 4)">
    <circle cx="28" cy="28" r="27" fill="#140D09" stroke="#C5A059" stroke-width="1.5" />
    <circle cx="28" cy="28" r="24.5" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6" />
    
    <!-- Atelier Arch -->
    <path d="M19 38 V 25 C 19 18, 37 18, 37 25 V 38" stroke="#C5A059" stroke-width="1.2" fill="none" stroke-linecap="round" />
    
    <!-- Dressmaker Mannequin Silhouette -->
    <!-- Neck & shoulders -->
    <path d="M25 21 H31 L32 23 L31 27 C30 29, 31 31, 33 34 H23 C25 31, 26 29, 25 27 L24 23 Z" fill="#C5A059" />
    <!-- Stand pole & base -->
    <line x1="28" y1="34" x2="28" y2="40" stroke="#C5A059" stroke-width="1.4" stroke-linecap="round" />
    <path d="M23 41 C25 39.5, 31 39.5, 33 41" stroke="#C5A059" stroke-width="1.4" stroke-linecap="round" fill="none" />
    
    <!-- Sparkles -->
    <!-- Top-right star -->
    <path d="M37 17 Q37 19 39 19 Q37 19 37 21 Q37 19 35 19 Q37 19 37 17 Z" fill="#D8C8AD" />
    <!-- Lower star -->
    <path d="M39 23 Q39 24.5 40.5 24.5 Q39 24.5 39 26 Q39 24.5 37.5 24.5 Q39 24.5 39 23 Z" fill="#D8C8AD" opacity="0.8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(70, 0)">
    <text x="0" y="32" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="600" letter-spacing="0.28em" fill="#FAF7F0">
      LABEL BY VINNIE
    </text>
    <text x="1" y="46" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="500" letter-spacing="0.22em" fill="#C5A059">
      UNLIMITED FASHION CHOICES
    </text>
  </g>
</svg>